<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>El Mejor | Nuestra Carta</title>
  <meta name="description" content="Carta digital de Pollos y Parrillas El Mejor" />
  <meta name="theme-color" content="#5b0000" />
  <link rel="icon" href="images/logo.png" />
  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#2b0000}
    body{margin:0;background:linear-gradient(#4e0000,#270000);font-family:Arial,Helvetica,sans-serif;color:white}
    .wrap{width:min(100%,760px);margin:0 auto;background:#5b0000;box-shadow:0 0 35px rgba(0,0,0,.35)}
    .menu-page{display:block;width:100%;height:auto;margin:0;border:0}
    .separator{height:10px;background:#350000}
    .footer{padding:18px 14px 26px;text-align:center;font-size:14px;background:#350000;color:#f7dfb3}
    .top{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:999px;background:rgba(255,191,45,.92);color:#4b0000;text-decoration:none;display:grid;place-items:center;font-size:24px;font-weight:bold;box-shadow:0 4px 16px rgba(0,0,0,.35)}
  </style>
</head>
<body>
  <main class="wrap" id="inicio">
    <img class="menu-page" src="images/01-portada.png" alt="Portada de la carta de Pollos y Parrillas El Mejor" />
    <div class="separator"></div>
    <img class="menu-page" src="images/02-pollo-brasa.png" alt="Pollo a la brasa y precios" loading="lazy" />
    <div class="separator"></div>
    <img class="menu-page" src="images/03-parrillas.png" alt="Parrillas y precios" loading="lazy" />
    <div class="separator"></div>
    <img class="menu-page" src="images/04-broaster.png" alt="Pollo broaster y precios" loading="lazy" />
    <div class="separator"></div>
    <img class="menu-page" src="images/05-chifa.png" alt="Chifa y precios" loading="lazy" />
    <div class="footer">Pollos y Parrillas El Mejor · Carta digital</div>
  </main>
  <a class="top" href="#inicio" aria-label="Volver arriba">↑</a>
</body>
</html>
